server {
    listen 80;
    listen 8080;
    server_name _;
    root /data/enterprise/front;
    index index.html;

    # WebSocket（IM 实时推送）：必须透传升级头
    location /infra/ws {
        proxy_pass http://127.0.0.1:48080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # index.html 禁缓存：发版后浏览器强制协商，杜绝旧版引用已删除的 hash 资源导致白屏/404
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 移动工作台（uni-app H5），同源部署免 CORS；history 路由回退到自身 index.html
    location /m/ {
        alias /data/enterprise/mobile/;
        index index.html;
        try_files $uri $uri/ /m/index.html;
    }
    location = /m/index.html {
        alias /data/enterprise/mobile/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 带 hash 的静态构建产物：内容不变可长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 竞赛 AI 服务（FastAPI RAG）：仅本机 49000，经 nginx 同源反代
    location /race-api/ {
        proxy_pass http://127.0.0.1:49000/;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    # 后端 API 代理
    location /admin-api/ {
        proxy_pass http://127.0.0.1:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
}
