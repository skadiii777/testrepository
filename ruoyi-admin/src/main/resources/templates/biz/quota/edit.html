<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改假期余额')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-quota-edit">
            <input type="hidden" name="id" th:value="${quota.id}">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">员工姓名：</label>
                <div class="col-sm-8">
                    <input name="empName" class="form-control" type="text" required th:value="${quota.empName}">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">假期类型：</label>
                <div class="col-sm-8">
                    <select name="leaveType" class="form-control m-b" th:with="type=${@dict.getType('biz_leave_type')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                                th:selected="${dict.dictValue == quota.leaveType}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">年份：</label>
                <div class="col-sm-8">
                    <input name="year" class="form-control" type="text" required maxlength="4" th:value="${quota.year}">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">配额天数：</label>
                <div class="col-sm-8">
                    <input name="quotaDays" class="form-control" type="number" step="0.5" min="0" required th:value="${quota.quotaDays}">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">已用天数：</label>
                <div class="col-sm-8">
                    <input name="usedDays" class="form-control" type="number" step="0.5" min="0" th:value="${quota.usedDays}">
                    <span class="help-block m-b-none">一般由审批自动扣减，手工修正请谨慎</span>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <input name="remark" class="form-control" type="text" maxlength="200" th:value="${quota.remark}">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script type="text/javascript">
        var prefix = ctx + "biz/quota";

        $("#form-quota-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-quota-edit').serialize());
            }
        }
    </script>
</body>
</html>
