<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('edit考勤')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-attendance-edit">
            <input type="hidden" name="id" th:value="${attendance.id}">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">员工姓名：</label>
                <div class="col-sm-8">
                    <input name="empName" class="form-control" type="text" th:value="attendance.empName">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">考勤日期：</label>
                <div class="col-sm-8">
                    <input name="workDate" class="form-control" type="text" th:value="attendance.workDate">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">上班时间：</label>
                <div class="col-sm-8">
                    <input name="checkIn" class="form-control" type="text" th:value="attendance.checkIn">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">下班时间：</label>
                <div class="col-sm-8">
                    <input name="checkOut" class="form-control" type="text" th:value="attendance.checkOut">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">考勤状态：</label>
                <div class="col-sm-8">
                    <select name="status" class="form-control m-b" th:with="type=${@dict.getType('biz_attendance_status')}">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="${attendance.status}"></option>
                </select>
                </div>
            </div>

        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script type="text/javascript">
        var prefix = ctx + "biz/attendance";

        $("#form-attendance-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-attendance-edit').serialize());
            }
        }
    </script>
</body>
</html>
