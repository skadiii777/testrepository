<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('提交汇报')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-report-add">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">汇报类型：</label>
                <div class="col-sm-8">
                    <select name="reportType" class="form-control m-b" th:with="type=${@dict.getType('biz_report_type')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">汇报日期：</label>
                <div class="col-sm-8">
                    <input id="reportDate" name="reportDate" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">标题：</label>
                <div class="col-sm-8">
                    <input name="title" class="form-control" type="text" required maxlength="200">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">汇报内容：</label>
                <div class="col-sm-8">
                    <textarea name="content" class="form-control" rows="8" required placeholder="今日完成工作 / 遇到的问题 / 明日计划"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-css" />
    <th:block th:include="include :: datetimepicker-js" />
    <script type="text/javascript">
        var prefix = ctx + "portal/report";

        $("#reportDate").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true,
            language: 'zh-CN'
        });

        $("#form-report-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-report-add').serialize());
            }
        }
    </script>
</body>
</html>
