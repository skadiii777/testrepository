<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('提交请假')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-leave-add">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">请假类型：</label>
                <div class="col-sm-8">
                    <select name="leaveType" class="form-control m-b" th:with="type=${@dict.getType('biz_leave_type')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">开始日期：</label>
                <div class="col-sm-8">
                    <input id="startDate" name="startDate" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">结束日期：</label>
                <div class="col-sm-8">
                    <input id="endDate" name="endDate" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">请假天数：</label>
                <div class="col-sm-8">
                    <input name="days" class="form-control" type="number" step="0.5" min="0.5" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">事由：</label>
                <div class="col-sm-8">
                    <textarea name="reason" class="form-control" rows="4"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-css" />
    <th:block th:include="include :: datetimepicker-js" />
    <script type="text/javascript">
        var prefix = ctx + "portal/leave";

        $("#startDate, #endDate").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true,
            language: 'zh-CN'
        });

        $("#form-leave-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-leave-add').serialize());
            }
        }
    </script>
</body>
</html>
