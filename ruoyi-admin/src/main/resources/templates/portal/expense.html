<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('我的报销')" />
</head>
<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="expense-form">
                    <div class="select-list">
                        <ul>
                            <li>
                                费用类别：<select name="category" th:with="type=${@dict.getType('biz_expense_type')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                审批状态：<select name="status" th:with="type=${@dict.getType('biz_expense_status')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.modal.open('提交报销', 'portal/expense/add')" shiro:hasPermission="portal:expense:add">
                    <i class="fa fa-plus"></i> 提交报销
                </a>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var types = [[${@dict.getType('biz_expense_type')}]];
        var statusList = [[${@dict.getType('biz_expense_status')}]];
        var prefix = ctx + "portal/expense";

        $(function() {
            var options = {
                url: prefix + "/list",
                modalName: "报销",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '编号'
                },
                {
                    field: 'category',
                    title: '费用类别',
                    align: 'center',
                    formatter: function(value) { return $.table.selectDictLabel(types, value); }
                },
                {
                    field: 'amount',
                    title: '金额',
                    align: 'right'
                },
                {
                    field: 'expenseDate',
                    title: '费用日期'
                },
                {
                    field: 'reason',
                    title: '费用说明'
                },
                {
                    field: 'status',
                    title: '审批状态',
                    align: 'center',
                    formatter: function(value) { return $.table.selectDictLabel(statusList, value); }
                },
                {
                    field: 'auditRemark',
                    title: '审批意见'
                },
                {
                    field: 'auditBy',
                    title: '审批人'
                },
                {
                    field: 'createTime',
                    title: '提交时间'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row) {
                        if (row.status === '0') {
                            return '<a class="btn btn-danger btn-xs" href="javascript:void(0)" onclick="withdraw(\'' + row.id + '\')"><i class="fa fa-undo"></i>撤回</a>';
                        }
                        return '-';
                    }
                }]
            };
            $.table.init(options);
        });

        function withdraw(id) {
            $.modal.confirm('确认撤回该报销申请？', function() {
                $.post(ctx + "portal/expense/remove", { id: id }, function(result) {
                    if (result.code == web_status.SUCCESS) {
                        $.modal.msgSuccess("撤回成功");
                        $.table.refresh();
                    } else {
                        $.modal.alertError(result.msg);
                    }
                });
            });
        }
    </script>
</body>
</html>
